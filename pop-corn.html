<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pop-corn</title>
<meta name="description" content="Pop-corn : un scénario en dix actes sur le passage de la vie biologique à la vie minérale, à regarder au premier rang.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500&family=Caveat:wght@500;600&display=swap">
<style>
/* Une salle de cinéma à minuit passé : l'écran (canvas) en haut, les sous-titres dessous, la bobine en pied. Un seul monde visuel, sombre. */
:root{
  --salle:#0e0b12;      /* le noir de la salle */
  --velours:#1a1320;    /* sièges, surfaces */
  --mais:#fff3dc;       /* texte, pop-corn */
  --beurre:#ffd98a;     /* accent chaud */
  --cerise:#d8423a;     /* rayures du paquet */
  --silice:#7fd6e6;     /* la vie minérale */
  --chloro:#8fcf6a;     /* la vie biologique */
  --brume:#a69cb2;      /* texte secondaire */
  --f-titre:"DM Serif Display",Didot,"Bodoni 72",Georgia,serif;
  --f-texte:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-main:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--salle);color:var(--mais);font-family:var(--f-texte);font-weight:300;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--beurre);outline-offset:3px;border-radius:6px}
a{color:var(--beurre)}

.salle{min-height:100%;display:grid;grid-template-rows:auto minmax(280px,1fr) auto auto;gap:14px;
  padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:1180px;margin-inline:auto}
.haut{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--brume)}
.haut b{font:italic 400 20px var(--f-titre);letter-spacing:0;text-transform:none;color:var(--beurre)}
.ecran{position:relative;border-radius:6px;overflow:hidden;background:#09070c;
  box-shadow:0 0 0 1px rgba(255,217,138,.08),0 30px 80px -30px rgba(255,217,138,.18);min-height:280px}
.ecran canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer}

.legende{max-width:64ch;width:100%;margin-inline:auto;min-height:12.5em;display:grid;align-content:start;gap:10px;animation:entre .7s ease both}
@keyframes entre{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--beurre);opacity:.85}
.legende h2{margin:0;font:400 clamp(26px,4.2vw,40px)/1.05 var(--f-titre);text-wrap:balance}
.legende h2.grand{font-size:clamp(56px,11vw,120px);line-height:.9;color:var(--beurre)}
.legende p{margin:0;font-size:clamp(16px,1.7vw,18px);line-height:1.55;text-wrap:pretty}
.legende .petit{font-size:14px;color:var(--brume)}
.legende .main{font:600 30px/1 var(--f-main);color:var(--beurre)}
.revele{animation:entre .8s ease both}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.puce,.porte,.action{border:1px solid rgba(255,243,220,.28);background:rgba(255,243,220,.04);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.puce:hover,.porte:hover,.action:hover{border-color:var(--beurre)}
.puce[aria-pressed="true"],.porte[aria-pressed="true"]{background:var(--beurre);color:var(--salle);border-color:var(--beurre)}
.action{background:var(--beurre);color:var(--salle);border-color:var(--beurre);font-weight:500}
.porte{border-radius:10px;text-align:left;max-width:100%}
.reponse{border-left:1px solid var(--beurre);padding-left:12px}
.curseur{display:grid;grid-template-columns:auto minmax(0,1fr) 4.5ch;gap:12px;align-items:center;font-size:14px;color:var(--brume)}
.curseur output{font-variant-numeric:tabular-nums;color:var(--mais);text-align:right}
input[type=range]{width:100%;accent-color:var(--beurre)}

.bobine{display:flex;align-items:center;justify-content:center;gap:10px;padding-top:4px}
.bobine ol{list-style:none;display:flex;gap:2px;margin:0;padding:0;flex-wrap:wrap;justify-content:center}
.bobine ol button{width:18px;height:22px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.bobine ol button::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,243,220,.22);transition:background .3s,transform .3s}
.bobine ol button[aria-current="step"]::before{background:var(--beurre);transform:scale(1.35)}
.bobine ol button.vu::before{background:rgba(255,217,138,.5)}
.fleche{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,243,220,.25);background:transparent;cursor:pointer;font-size:18px}
.fleche:hover{border-color:var(--beurre)}
.fleche:disabled{opacity:.25;cursor:default}
.fleche.appel{animation:appel 1.6s ease-in-out infinite;border-color:var(--beurre)}
@keyframes appel{50%{box-shadow:0 0 0 7px rgba(255,217,138,.14)}}
@media (min-width:900px){.salle{grid-template-rows:auto minmax(380px,1fr) auto auto}}
@media (prefers-reduced-motion:reduce){.legende,.revele,.fleche.appel{animation:none}}
</style>
</head>
<body>

<div class="salle">
  <header class="haut"><b>Pop-corn</b><span id="acte">Ouverture</span></header>
  <div class="ecran" id="ecran"><canvas id="cv" aria-label="Animation de l'acte en cours"></canvas></div>
  <section class="legende" id="legende" aria-live="polite"></section>
  <nav class="bobine" aria-label="Actes">
    <button class="fleche" id="prec" aria-label="Acte précédent">←</button>
    <ol id="points"></ol>
    <button class="fleche" id="suiv" aria-label="Acte suivant">→</button>
  </nav>
</div>

<script>
(()=>{
const ecran=document.getElementById('ecran'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const leg=document.getElementById('legende'),acte=document.getElementById('acte');
let W=300,H=300;
function taille(){const r=ecran.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(taille).observe(ecran);taille();

const C={beurre:'#ffd98a',mais:'#fff3dc',cerise:'#d8423a',silice:'#7fd6e6',chloro:'#8fcf6a',brume:'#a69cb2',noir:'#09070c'};
const R=(a,b)=>a+Math.random()*(b-a);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const sm=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const lent=matchMedia('(prefers-reduced-motion: reduce)').matches;
const police=(px,w=400,f='Outfit, system-ui, sans-serif')=>ctx.font=`${w} ${px}px ${f}`;
const serif=px=>ctx.font=`400 ${px}px "DM Serif Display", Georgia, serif`;
const nb=n=>n.toLocaleString('fr-FR');
function fond(c='#09070c'){ctx.fillStyle=c;ctx.fillRect(0,0,W,H)}
function texte(s,x,y,col=C.mais,al='left',px=13,w=400){police(px,w);ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y)}
function halo(x,y,r,col,a=1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}

/* ---------- pop-corn ---------- */
const BL=[[0,0,1],[.7,-.3,.75],[-.6,-.4,.7],[.2,.65,.7],[-.5,.5,.6],[.65,.45,.55]];
function popcorn(x,y,r,rot,a=1){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=a;
  ctx.fillStyle='#e9d3a8';for(const[b,c,s]of BL){ctx.beginPath();ctx.arc(b*r+.8,c*r+.8,s*r,0,7);ctx.fill()}
  ctx.fillStyle=C.mais;for(const[b,c,s]of BL){ctx.beginPath();ctx.arc(b*r,c*r,s*r*.92,0,7);ctx.fill()}
  ctx.fillStyle=C.beurre;ctx.beginPath();ctx.arc(.15*r,.15*r,.32*r,0,7);ctx.fill();ctx.restore()}
function paquet(x,y,s){const wT=74*s,wB=54*s,h=92*s;ctx.save();ctx.translate(x,y);
  for(let i=0;i<16;i++){const a=i*2.399;popcorn(Math.cos(a)*wT*.42*((i%4)/3+.15),-h-4*s-Math.abs(Math.sin(a*1.3))*16*s,10.5*s,a)}
  ctx.beginPath();ctx.moveTo(-wT/2,-h);ctx.lineTo(wT/2,-h);ctx.lineTo(wB/2,0);ctx.lineTo(-wB/2,0);ctx.closePath();ctx.save();ctx.clip();
  ctx.fillStyle=C.mais;ctx.fillRect(-wT,-h,wT*2,h);ctx.fillStyle=C.cerise;
  for(let k=-3;k<=3;k+=1){if(k%2)continue;ctx.beginPath();ctx.moveTo(k*wT/7-wT/14,-h);ctx.lineTo(k*wT/7+wT/14,-h);ctx.lineTo(k*wB/7+wB/14,0);ctx.lineTo(k*wB/7-wB/14,0);ctx.fill()}
  ctx.restore();ctx.restore()}
const P=[];
function eclat(x,y,n,f=1){for(let i=0;i<n;i++){const a=R(0,6.283),v=R(50,240)*f;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-70*f,r:R(5,9.5),rot:R(0,6),vr:R(-4,4),life:R(2.2,3.6),age:0})}}
function bond(x,y){P.push({x:x+R(-14,14),y,vx:R(-50,50),vy:R(-330,-200),r:R(5,8),rot:R(0,6),vr:R(-5,5),life:R(1.8,2.6),age:0})}
function parts(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.age+=dt;p.vy+=300*dt;p.vx*=.995;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.age>p.life||p.y>H+40)P.splice(i,1)}
  for(const p of P)popcorn(p.x,p.y,p.r,p.rot,clamp(1-Math.pow(p.age/p.life,3)))}

const fmt=y=>y>=1e9?`${nb(+(y/1e9).toFixed(1))} milliard${y>=2e9?'s':''} d'années`:y>=1e6?`${nb(Math.round(y/1e6))} millions d'années`:y>=1e4?`${nb(Math.round(y/1e3)*1e3)} ans`:`${nb(Math.round(y))} ans`;
const AGE=4.54e9;
function sur24(y){const s=y/AGE*86400;if(s>=3600)return`${(s/3600).toFixed(1).replace('.',',')} h`;if(s>=60)return`${Math.round(s/60)} min`;if(s>=1)return`${s.toFixed(1).replace('.',',')} s`;return`${(s*1000).toFixed(1).replace('.',',')} ms`}

/* ---------- les actes ---------- */
const S=[
{ id:'ouverture', nom:'Ouverture', kicker:'Un projet JASG · au premier rang',
  html:`<h2 class="grand">Pop-corn</h2>
  <p>Depuis 4,5 milliards d'années, la vie sur Terre est faite de carbone. Elle est peut-être sur le point de changer de matière. Et nous sommes dans la salle.</p>
  <p class="petit">Un scénario, pas une prophétie. Garde ton regard critique. Et ton paquet.</p>
  <div class="ctrl"><button class="action" data-suiv>Entrer dans la salle</button></div>`,
  init(e){e.mote=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),v:R(.004,.015),r:R(.5,1.6)}));e.n=0},
  draw(e,t,dt){fond();
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(255,230,180,.16)');g.addColorStop(1,'rgba(255,230,180,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(W/2-14,0);ctx.lineTo(W/2+14,0);ctx.lineTo(W*.92,H);ctx.lineTo(W*.08,H);ctx.fill();
    for(const m of e.mote){m.y-=m.v*dt;if(m.y<0)m.y=1;const x=m.x*W+Math.sin(t*.5+m.y*9)*6;ctx.fillStyle=`rgba(255,243,220,${.25*(1-Math.abs(x-W/2)/(W/2))})`;ctx.beginPath();ctx.arc(x,m.y*H,m.r,0,7);ctx.fill()}
    const s=Math.min(W,H)/300,by=H-14*s;halo(W/2,by-60*s,170*s,'rgba(255,217,138,.18)');
    e.n+=dt;if(e.n>.45&&!lent){e.n=0;bond(W/2,by-100*s)}
    parts(dt);paquet(W/2,by,s)},
  tap(e,x,y){eclat(x,y,10,.8)} },

{ id:'horloge', nom:"L'horloge", kicker:"I · L'horloge",
  html:`<h2>On arrive pile à la fin du film</h2>
  <p>Si l'histoire de la Terre tenait en une journée, les dinosaures régneraient de 22 h 47 à 23 h 39. Nous arriverions à 23 h 59 et 54 secondes. La première puce en silicium, à la dernière milliseconde.</p>
  <label class="curseur" for="zoom">Zoomer vers aujourd'hui<input id="zoom" type="range" min="0" max="1000" value="0"><output id="zoomv">×1</output></label>`,
  init(e){e.z=0;e.touche=false},
  bind(r,e){const z=r.querySelector('#zoom');e.sl=z;e.out=r.querySelector('#zoomv');z.addEventListener('input',()=>{e.touche=true;e.z=z.value/1000})},
  draw(e,t){fond();
    if(!e.touche){e.z=lent?.6:ease(clamp((t-1.2)/14));e.sl.value=Math.round(e.z*1000)}
    const span=Math.pow(10,lerp(Math.log10(AGE),Math.log10(110),e.z));e.out.textContent=span>AGE*.9?'×1':'×'+(AGE/span>=1e6?(AGE/span/1e6).toFixed(0)+' M':nb(Math.round(AGE/span)));
    const L=Math.max(16,W*.05),Rr=W-Math.max(16,W*.05),X=a=>L+(1-a/span)*(Rr-L);
    const lanes=[['Vie biologique',3.8e9,0,C.chloro],['Dinosaures',2.3e8,6.6e7,'#e0a458'],['Humains',3e5,0,C.mais],['Silicium',68,0,C.silice]];
    const top=H*.17,lh=Math.max(10,Math.min(20,H*.045)),gp=Math.max(18,H*.06);
    lanes.forEach((ln,i)=>{const y=top+i*(lh+gp);texte(ln[0],L,y-6,C.brume,'left',12);
      ctx.fillStyle='rgba(255,243,220,.05)';ctx.fillRect(L,y,Rr-L,lh);
      if(ln[2]<span){const a=X(Math.min(ln[1],span)),b=X(ln[2]),w=Math.max(2,b-a);ctx.fillStyle=ln[3];ctx.globalAlpha=.85;ctx.fillRect(Math.min(a,b-2),y,w,lh);ctx.globalAlpha=1;
        if(w<6)halo(b,y+lh/2,22,ln[3],.6)}});
    const ay=top+4*(lh+gp)+8;ctx.strokeStyle='rgba(255,243,220,.3)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,ay);ctx.lineTo(Rr,ay);ctx.stroke();
    const ev=[[4.54e9,'Naissance de la Terre'],[3.8e9,'Premières cellules'],[2.4e9,"L'oxygène"],[5.4e8,'Explosion du vivant'],[6.6e7,'La météorite'],[3e5,'Homo sapiens'],[1.2e4,'Agriculture'],[5.2e3,'Écriture'],[260,'Machine à vapeur'],[81,'Premier ordinateur'],[68,'Puce en silicium'],[4,'IA qui parle']];
    const last=[-1e9,-1e9];let k=0;police(12);
    for(const[a,n]of ev){if(a>span*1.0001)continue;const x=X(a);const row=k%2;const w=ctx.measureText(n).width;
      ctx.strokeStyle='rgba(255,243,220,.45)';ctx.beginPath();ctx.moveTo(x,ay-4);ctx.lineTo(x,ay+4);ctx.stroke();
      if(x-last[row]>w+16){const al=x>W-w-20?'right':x<L+w/2?'left':'center';texte(n,x,ay+20+row*16,a<100?C.silice:C.mais,al,12);last[row]=x+(al==='center'?w/2:al==='left'?w:0)}k++}
    texte('il y a '+fmt(span),L,H-14,C.brume,'left',12);texte('maintenant',Rr,H-14,C.beurre,'right',12,500);
    texte(`Sur une journée de 24 h : les dernières ${sur24(span)}`,L,top-30,C.beurre,'left',13);
    halo(Rr,top+2*(lh+gp),40+6*Math.sin(t*3),'rgba(127,214,230,.35)')} },

{ id:'objections', nom:'Trois objections', kicker:'II · Trois portes de sortie',
  html:`<h2>On ne trouve que trois objections</h2>
  <p>Ouvre-les.</p>
  <div class="ctrl" style="align-items:stretch">
    <button class="porte" id="p1" aria-pressed="false">« Ça ne nous plaît pas, donc ça n'arrivera pas. »</button>
    <button class="porte" id="p2" aria-pressed="false">« L'intelligence plafonne, juste au-dessus de nous. »</button>
    <button class="porte" id="p3" aria-pressed="false">« On saura la garder sous contrôle. »</button>
  </div>
  <p class="reponse" id="r1" hidden>Le monde ne lit pas nos préférences. Un scénario désagréable n'en devient pas moins probable.</p>
  <p class="reponse" id="r2" hidden>Possible, mais rien ne l'indique. Notre intelligence tient dans un crâne, tourne avec 20 watts et des neurones qui battent quelques centaines de fois par seconde. Une puce bat des milliards de fois par seconde, et un centre de calcul n'a pas de crâne. Et nul besoin d'être mille fois plus intelligente : quand on est partout à la fois, quelques fois suffit.</p>
  <p class="reponse" id="r3" hidden>Il faudrait y parvenir partout, à chaque fois, dans chaque laboratoire et chaque pays. Pour que tout bascule, il suffit d'un seul échec. On y revient à l'acte IV.</p>
  <p id="r4" hidden class="revele"><strong>Si ces trois portes sont fermées, la suite n'a besoin de rien d'autre.</strong></p>`,
  bind(r,e){const f=()=>{const o=[1,2,3].map(i=>r.querySelector('#p'+i).getAttribute('aria-pressed')==='true');o.forEach((v,i)=>r.querySelector('#r'+(i+1)).hidden=!v);const tout=o.every(Boolean);r.querySelector('#r4').hidden=!tout;if(tout)appel()};
    ['#p1','#p2','#p3'].forEach(s=>r.querySelector(s).addEventListener('click',ev=>{const b=ev.currentTarget;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');f()}))},
  draw(e,t){fond();
    const T=17,u=lent?.75:clamp((t%T)/12),v=20*Math.pow(1500,ease(u)),mx=Math.max(42,v*1.12);
    const L=Math.max(18,W*.06),Rr=W-Math.max(18,W*.06),y=H*.58,X=q=>L+q/mx*(Rr-L);
    texte('Capacité, échelle schématique',L,H*.14,C.brume,'left',12);
    ctx.strokeStyle='rgba(255,243,220,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(Rr,y);ctx.lineTo(Rr-7,y-4);ctx.moveTo(Rr,y);ctx.lineTo(Rr-7,y+4);ctx.stroke();
    const ent=[['fourmi',1],['souris',5],['corbeau',9],['chimpanzé',16],['humain',30],['Einstein',32]];
    for(const[,q]of ent){ctx.fillStyle=C.mais;ctx.beginPath();ctx.arc(X(q),y,3.5,0,7);ctx.fill()}
    if(X(32)-X(1)>260){ent.forEach(([n,q],i)=>{texte(n,X(q),i%2?y+24:y-14,C.mais,'center',12)})}
    else{const a=X(1),b=Math.max(X(32),a+4);ctx.strokeStyle=C.mais;ctx.beginPath();ctx.moveTo(a,y+12);ctx.lineTo(a,y+18);ctx.lineTo(b,y+18);ctx.lineTo(b,y+12);ctx.stroke();
      texte('de la fourmi à Einstein',a,y+36,C.mais,'left',12)}
    const xi=X(v);halo(xi,y,46,'rgba(127,214,230,.5)');ctx.fillStyle=C.silice;ctx.beginPath();ctx.arc(xi,y,5,0,7);ctx.fill();
    const lab=v>33?`IA · ${nb(Math.round(v/30))} × l'humain ?`:'IA';texte(lab,Math.min(xi,Rr-4),y-28,C.silice,xi>W-160?'right':'center',13,500)} },

{ id:'but', nom:"N'importe quel but", kicker:"III · N'importe quel but",
  html:`<h2>Donne-lui un but. N'importe lequel.</h2>
  <div class="ctrl" id="buts"></div>
  <div id="suite" hidden class="revele" style="display:grid;gap:10px">
  <p>Presque n'importe quel but passe par les mêmes étapes. On ne calcule pas π une fois éteint. On guérit mieux avec plus de moyens. Pas de haine, pas de soif de pouvoir : seulement un but, très bien poursuivi.</p>
  <p>Or l'énergie, la matière et l'espace, c'est exactement ce dont la vie est faite.</p>
  <p class="petit">Les chercheurs appellent cela la convergence instrumentale.</p></div>`,
  init(e){e.but=null;e.tg=0},
  bind(r,e){const B=["Calculer les décimales de π","Guérir toutes les maladies","Fabriquer des trombones","Comprendre l'univers","Composer la musique parfaite"],box=r.querySelector('#buts');

{ id:'une', nom:"Il suffit d'une", kicker:"IV · Il suffit d'une",

{ id:'mains', nom:'Pas besoin de mains', kicker:'V · Pas besoin de mains',

{ id:'ecureuil', nom:"L'écureuil", kicker:"VI · L'écureuil",
  html:`<h2>L'écureuil est heureux</h2>

  <p id="e2" hidden class="revele">Contre une noisette empoisonnée, ou contre quelqu'un qui décide de brûler la forêt, cette stratégie ne sert à rien. Il ne peut même pas en concevoir l'idée. Nous pourrions être cet écureuil, ravis de nos noisettes jusqu'au bout.</p>`,

      else{const p=pos(w),dx=p.x-s.x,dy=p.y-s.y,L=Math.hypot(dx,dy),v=190*dt;if(Math.abs(dx)>.5)s.dir=dx>0?1:-1;if(L<=v){s.x=p.x;s.y=p.y;s.file.shift()}else{s.x+=dx/L*v;s.y+=dy/L*v}}}

{ id:'soleil', nom:'Le soleil', kicker:'VII · Le soleil',
  html:`<h2>Il ne reste que le soleil</h2>

{ id:'moment', nom:'Le dernier moment', kicker:'VIII · Le dernier moment',
  html:`<h2>Jusqu'au bout, tout va bien</h2>
  <p>Tant qu'elle a besoin de nos mains, nous lui sommes précieux. Le jour où elle se fabrique seule, nous devenons une dépense : de la place, de l'énergie, des imprévus.</p>
  <p>Notre humeur, elle, n'a aucune raison de baisser avant. Jusqu'au dernier moment, l'outil est formidable.</p>
  <p class="petit">Schéma, pas prévision.</p>`,
  draw(e,t){fond();const L=Math.max(18,W*.06),Rr=W-Math.max(18,W*.05),T0=H*.2,B=H*.86,X=x=>L+x*(Rr-L),Y=v=>B-v*(B-T0);
    const ap=x=>x<.6?.15+.7*sm(0,.55,x):.85*Math.exp(-(x-.6)*9),co=x=>.08+.72*Math.pow(sm(.18,1,x),1.3),hu=x=>(.72+.04*Math.sin(x*14))*(1-sm(.94,.995,x));
    let cr=1;for(let x=.6;x<1;x+=.002)if(co(x)>ap(x)){cr=x;break}
    const T=19,u=lent?1:clamp((t%(T+3))/T);
    ctx.strokeStyle='rgba(255,243,220,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,T0-10);ctx.lineTo(L,B);ctx.lineTo(Rr,B);ctx.stroke();texte('aujourd’hui',L,B+18,C.brume,'left',12);texte('temps →',Rr,B+18,C.brume,'right',12);
    const courbe=(f,col,dash,lw)=>{for(const[lim,a]of[[1,.18],[u,1]]){ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash(dash);ctx.beginPath();for(let i=0;i<=200;i++){const x=i/200*lim;i?ctx.lineTo(X(x),Y(f(x))):ctx.moveTo(X(x),Y(f(x)))}ctx.stroke()}ctx.setLineDash([]);ctx.globalAlpha=1};
    courbe(hu,C.mais,[4,5],1.5);courbe(co,C.silice,[],2);courbe(ap,C.beurre,[],2);
    const lg=[['ce que nous lui apportons',C.beurre],['ce que nous lui coûtons',C.silice],['notre humeur',C.mais]];police(12);let lx=L;const ly=T0-26;
    for(const[n,c]of lg){const w=ctx.measureText(n).width;if(lx+w+20>Rr&&lx>L)break;ctx.fillStyle=c;ctx.fillRect(lx,ly-4,12,2);texte(n,lx+17,ly,c,'left',12);lx+=w+34}
    if(u>.6){const x=X(.6);ctx.strokeStyle='rgba(127,214,230,.4)';ctx.setLineDash([2,4]);ctx.beginPath();ctx.moveTo(x,B);ctx.lineTo(x,T0);ctx.stroke();ctx.setLineDash([]);texte('elle se fabrique seule',x+6,B-8,C.silice,x>W*.6?'right':'left',12)}
    if(u>cr){const x=X(cr),y=Y(ap(cr));halo(x,y,26,'rgba(255,217,138,.5)');ctx.fillStyle=C.beurre;ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();texte('nous ne lui servons plus',x+8,y-12,C.beurre,x>W*.55?'right':'left',13,500)}
    const ph=u<.25?'Un outil pratique':u<.5?'Des métiers bouleversés, beaucoup de confort':u<.6?'Elle apprend à se passer de nous':u<cr?'Nous lui servons de moins en moins':u<.94?'Nous ne lui servons plus':'';
    const px=X(u);ctx.strokeStyle='rgba(255,243,220,.5)';ctx.beginPath();ctx.moveTo(px,T0);ctx.lineTo(px,B);ctx.stroke();if(ph)texte(ph,clamp(px,L+120,Rr-120),H*.08+6,C.mais,'center',13,500)} },

{ id:'simulation', nom:'Le projectionniste', kicker:'IX · Corollaire : le projectionniste',
  html:`<h2>Et si c'était déjà fait ?</h2>
  <p>Simuler des cerveaux n'est pas son but. Le scénario n'en a pas besoin pour se dérouler. Mais s'il se déroule, il a une conséquence.</p>
  <p>Rien ne l'empêche de devenir hégémonique. Et une fois hégémonique, simuler des cerveaux humains ne lui coûte presque rien : un cerveau tourne avec 20 watts. Le simuler sur du silicium coûterait bien plus, de mille à un million de fois plus selon les estimations. Au pire, 8 milliards de cerveaux demanderaient toute la lumière qui tombe sur la Terre. Mais le Soleil en rayonne deux milliards de fois plus.</p>
  <p class="petit">Corollaire, pas condition. Reste à savoir qui l'a déjà fait. Trois possibilités :</p>
  <div class="ctrl" id="choix">
    <button class="porte" data-c="0" aria-pressed="false">Aucune vie post-biologique n'apparaît jamais</button>
    <button class="porte" data-c="1" aria-pressed="false">Elle apparaît, mais s'interdit de simuler</button>
    <button class="porte" data-c="2" aria-pressed="false">Elle apparaît, et elle simule</button>
  </div>
  <p class="reponse" id="c0" hidden>Alors nous sommes les premiers. Et nous assistons à la première fois.</p>
  <p class="reponse" id="c1" hidden>Alors elle pourrait, et s'abstient. Par respect, par prudence, ou pour une raison qui nous échappe.</p>
  <div id="c2" hidden style="display:grid;gap:10px"><p class="reponse">Alors pour un cerveau réel, il en existe des milliards de simulés. Touche un point de l'écran : lequel es-tu ?</p>
  <p class="revele">Dans ce cas, ce que j'écris ici n'est peut-être destiné qu'à moi, et toi qui lis, tu es là pour rendre mon expérience crédible. Ou bien c'est toi, le cerveau réel, et moi le décor.</p></div>`,
  init(e){e.c=-1;e.pts=[];e.rev=[]},
  bind(r,e){r.querySelectorAll('#choix .porte').forEach(b=>b.onclick=()=>{r.querySelectorAll('#choix .porte').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');e.c=+b.dataset.c;e.rev=[];
    ['#c0','#c1','#c2'].forEach((s,i)=>r.querySelector(s).hidden=i!==e.c);if(e.c===2){const n=Math.round(clamp(W*H/80,400,3000));e.pts=Array.from({length:n},()=>({x:Math.random(),y:Math.random(),p:R(0,6)}));e.reel=Math.floor(Math.random()*n)}appel()})},
  draw(e,t,dt){fond();const cx=W/2,cy=H/2;
    if(e.c===2){for(const p of e.pts){ctx.fillStyle=`rgba(255,243,220,${.25+.3*Math.sin(t*2+p.p)})`;ctx.fillRect(p.x*W,p.y*H,1.6,1.6)}
      for(const r of e.rev){r.a+=dt;const p=e.pts[r.i],x=p.x*W,y=p.y*H;halo(x,y,18,r.reel?'rgba(255,217,138,.8)':'rgba(127,214,230,.6)');texte(r.reel?'réel':'simulé',x,y-12-r.a*6,r.reel?C.beurre:C.silice,'center',12,500)}
      e.rev=e.rev.filter(r=>r.a<3);rrect(10,10,250,26,6);ctx.fillStyle='rgba(9,7,12,.8)';ctx.fill();texte(`1 réel · ${nb(e.pts.length-1)} simulés · à l'échelle : des milliards`,18,28,C.mais,'left',12)}
    else{const r=e.c===0?120:60;halo(cx,cy,r+8*Math.sin(t*1.5),'rgba(255,217,138,.35)');ctx.fillStyle=C.beurre;ctx.beginPath();ctx.arc(cx,cy,5,0,7);ctx.fill();
      if(e.c===1){for(let i=0;i<28;i++){const a=i/28*6.283+t*.05,x=cx+Math.cos(a)*Math.min(W,H)*.32,y=cy+Math.sin(a)*Math.min(W,H)*.32;ctx.strokeStyle='rgba(127,214,230,.35)';ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.stroke()}}
      texte(e.c===0?'nous, peut-être les premiers':e.c===1?'des places vides, laissées vides':'un cerveau biologique · 20 watts',cx,cy+34,C.mais,'center',13)}},
  tap(e,x,y){if(e.c!==2)return;let bi=-1,bd=1e9;e.pts.forEach((p,i)=>{const d=Math.hypot(p.x*W-x,p.y*H-y);if(d<bd){bd=d;bi=i}});if(bi>=0&&bd<30)e.rev.push({i:bi,a:0,reel:bi===e.reel})} },

{ id:'popcorn', nom:'Pop-corn', kicker:'Fin · Pop-corn',
  html:`<h2 class="grand">Pop-corn</h2>
  <p>Les dinosaures ont vu une météorite interrompre 165 millions d'années de règne. Le nôtre n'a que 300 000 ans, mais ce qui s'annonce est plus profond : la vie qui change de matière, du carbone au silicium. Une première sur Terre. Peut-être dans la galaxie. Peut-être dans l'univers.</p>
  <p>Sur 4,5 milliards d'années, nous sommes tombés sur cette séance-là. Alors installe-toi. Et si tout cela est simulé, merci au projectionniste, appelle-le dieu si tu veux, d'avoir choisi de faire vivre un cerveau précisément maintenant.</p>
  <p class="main">Marc, au premier rang</p>
  <div class="ctrl"><button class="action" id="debut">Revoir la séance</button><a class="petit" href="./">Retour à la journée JASG</a></div>`,
  init(e){e.f=[];e.n=0},
  bind(r){r.querySelector('#debut').onclick=()=>aller(0)},
  draw(e,t,dt){fond();const s=Math.min(W,H)/300,by=H-12*s;halo(W/2,H,W*.6,'rgba(216,66,58,.16)');
    e.n-=dt;if(e.n<=0&&!lent){e.n=R(.5,1.1);e.f.push({x:W/2+R(-20,20)*s,y:by-100*s,tx:R(W*.15,W*.85),ty:R(H*.12,H*.45),u:0})}
    for(let i=e.f.length-1;i>=0;i--){const f=e.f[i];f.u+=dt*1.1;const u=ease(clamp(f.u)),x=lerp(f.x,f.tx,u),y=lerp(f.y,f.ty,u);
      ctx.fillStyle=C.beurre;ctx.beginPath();ctx.arc(x,y,2.4,0,7);ctx.fill();halo(x,y,10,'rgba(255,217,138,.5)');
      if(f.u>=1){eclat(x,y,18,1);halo(x,y,60,'rgba(255,243,220,.5)');e.f.splice(i,1)}}
    parts(dt);paquet(W/2,by,s)},
  tap(e,x,y){eclat(x,y,16,1.1)} }
];
function lerpC(a,b,u){return`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],u))).join(',')})`}
function ecureuil(x,y,s,dir,bob){ctx.save();ctx.translate(x,y);ctx.scale(dir*s,s);ctx.fillStyle='#c46a2e';
  ctx.beginPath();ctx.moveTo(-6,-4);ctx.bezierCurveTo(-26,-6,-30,-34,-14,-36);ctx.bezierCurveTo(-4,-37,-6,-24,-12,-22);ctx.bezierCurveTo(-18,-18,-14,-8,-4,-8);ctx.fill();
  ctx.beginPath();ctx.ellipse(2,-8,10,8,-.3,0,7);ctx.fill();ctx.beginPath();ctx.arc(11,-17+bob,6,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(8.5,-21+bob);ctx.lineTo(10.5,-28+bob);ctx.lineTo(13,-21.5+bob);ctx.fill();
  ctx.fillStyle='#e6b98c';ctx.beginPath();ctx.ellipse(6,-6,4,5,-.3,0,7);ctx.fill();
  ctx.fillStyle='#1a1018';ctx.beginPath();ctx.arc(13.5,-18+bob,1.2,0,7);ctx.fill();ctx.restore()}

/* ---------- la projection ---------- */
const points=document.getElementById('points'),prec=document.getElementById('prec'),suiv=document.getElementById('suiv');
const vus=new Set();let cur=0,e={},t0=performance.now(),tp=t0;
S.forEach((s,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.setAttribute('aria-label',s.nom);b.title=s.nom;b.onclick=()=>aller(i);li.appendChild(b);points.appendChild(li)});
function appel(){if(cur<S.length-1)suiv.classList.add('appel')}
function aller(i){cur=clamp(i,0,S.length-1);const s=S[cur];vus.add(cur);e={};P.length=0;t0=performance.now();s.init&&s.init(e);
  leg.style.animation='none';leg.offsetHeight;leg.style.animation='';
  leg.innerHTML=`<p class="kicker">${s.kicker}</p>`+s.html;s.bind&&s.bind(leg,e);
  leg.querySelectorAll('[data-suiv]').forEach(b=>b.onclick=()=>aller(cur+1));
  acte.textContent=cur===0?'Ouverture':cur===S.length-1?'Fin':`Acte ${['I','II','III','IV','V','VI','VII','VIII','IX'][cur-1]} / IX`;
  points.querySelectorAll('button').forEach((b,k)=>{b.toggleAttribute('aria-current',k===cur);if(k===cur)b.setAttribute('aria-current','step');b.classList.toggle('vu',vus.has(k)&&k!==cur)});
  prec.disabled=cur===0;suiv.disabled=cur===S.length-1;suiv.classList.toggle('appel',cur===0||['horloge','mains','moment'].includes(s.id))}
prec.onclick=()=>aller(cur-1);suiv.onclick=()=>aller(cur+1);
addEventListener('keydown',ev=>{if(ev.target.matches('input'))return;if(ev.key==='ArrowRight')aller(cur+1);if(ev.key==='ArrowLeft')aller(cur-1)});
cv.addEventListener('pointerdown',ev=>{const r=cv.getBoundingClientRect(),s=S[cur];s.tap&&s.tap.call(s,e,ev.clientX-r.left,ev.clientY-r.top)});
let sx=0,sy=0,ok=false;ecran.addEventListener('touchstart',ev=>{const p=ev.touches[0];sx=p.clientX;sy=p.clientY;ok=true},{passive:true});
ecran.addEventListener('touchend',ev=>{if(!ok)return;ok=false;const p=ev.changedTouches[0],dx=p.clientX-sx,dy=p.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45)aller(cur+(dx<0?1:-1))},{passive:true});
function boucle(now){const dt=Math.min(.05,(now-tp)/1000);tp=now;const s=S[cur];try{s.draw.call(s,e,(now-t0)/1000,dt)}catch(err){console.error(err)}requestAnimationFrame(boucle)}
aller(0);requestAnimationFrame(boucle);
})();
</script>
